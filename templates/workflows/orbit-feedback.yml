name: Orbit feedback

# Verwerkt open klantfeedback tot een PR. Draait elke werkdag om 18:00 (zomertijd
# Amsterdam; let op: de cron staat in UTC en schuift een uur met de wintertijd mee)
# en is ook handmatig te starten.
on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      project:
        description: "Project page-id (leeg = secret NOTION_PROJECT_ID)"
        required: false

concurrency:
  group: orbit-feedback
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_PROJECT_ID: ${{ github.event.inputs.project || secrets.NOTION_PROJECT_ID }}
      GH_TOKEN: ${{ secrets.ORBIT_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORBIT_GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          # Set both names: a project .npmrc may authenticate npm.pkg.github.com
          # via ${NODE_AUTH_TOKEN} (from setup-node) or via ${NPM_TOKEN}. GITHUB_TOKEN
          # only works if this repo has read access under the package's "Manage
          # Actions access"; otherwise set ORBIT_NPM_TOKEN to a PAT with read:packages.
          NODE_AUTH_TOKEN: ${{ secrets.ORBIT_NPM_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.ORBIT_NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch open feedback
        id: fetch
        run: |
          npx orbit-feedback fetch --project "$NOTION_PROJECT_ID" --claim
          echo "count=$(jq '.items | length' .orbit/feedback.json)" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "orbit-feedback[bot]"
          git config user.email "orbit-feedback@users.noreply.github.com"
          git checkout -b "feedback/$(date +%F)"

      - name: Process feedback with Claude
        if: steps.fetch.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          # Without github_token the action mints its own GitHub App token via OIDC,
          # writes it into the git config, and revokes it when this step ends — so the
          # push in the next step fails with "Invalid username or token". Pass a token
          # we control so the git remote auth stays valid across steps.
          github_token: ${{ secrets.ORBIT_GH_TOKEN || github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(npm run *),Bash(npx *)"
          prompt: |
            Je verwerkt open Orbit-klantfeedback. Het manifest staat in
            `.orbit/feedback.json`. De branch is al aangemaakt en de punten staan
            al op "In behandeling". Doe ALLEEN stap 3 hieronder: NIET fetchen, GEEN
            branch maken, GEEN PR openen, GEEN Notion-status bijwerken — dat doet de
            workflow.

            Verwerk elk punt uit `.orbit/feedback.json`, in volgorde. Per punt:
            - Lokaliseer de code via `bron` (bestand:regel), dan `component`, dan
              `label`/`pagina`/`annotationId` (CSS-pad) met grep.
            - Ben je zeker en is het een codewijziging? Maak de kleinst mogelijke
              wijziging, draai typecheck/lint als die scripts bestaan, en commit het
              punt precies één keer met deze vorm:

                  fix(feedback): <korte Engelse samenvatting>

                  <auteur>: "<comment>"

                  Orbit-Feedback: <notion-page-id>

            - Twijfel je, of is het geen codewijziging (compliment, vraag,
              contentbeslissing)? Doe niets en noteer het in `.orbit/results.json`:
              { "<id>": { "skipped": true, "reason": "<reden in het Nederlands>" } }

            Harde regels: één punt = één commit; trailer verplicht; geen amend/squash;
            geen refactors, dependency-wijzigingen of formatting-only diffs; kom niet
            aan package.json of lockfiles; code en commits Engels, klantteksten
            Nederlands. Forceer geen gok — sla onzekere punten over met een reden.

      - name: Open pull request
        if: steps.fetch.outputs.count != '0'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="feedback/$(date +%F)"
          # Claude may skip every point (nothing to change). With no commits there is
          # no PR to open — releasing the points instead of failing on an empty branch.
          # --from-manifest resets all claimed points to Open; --from-results then
          # writes each skip reason as the answer.
          COMMITS=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")
          if [ "$COMMITS" -eq 0 ]; then
            echo "Geen commits — alle punten overgeslagen. Punten worden vrijgegeven."
            npx orbit-feedback status --from-manifest --set Open
            npx orbit-feedback status --from-results --set Open
            exit 0
          fi
          npx orbit-feedback pr-body > .orbit/pr-body.md
          # The feedback/<date> branch is only ever created by this workflow, so a
          # leftover from a failed run earlier today is safe to overwrite. Fetch it
          # first so --force-with-lease has a baseline (it still refuses if someone
          # else pushed to it in the meantime).
          git fetch origin "$BRANCH" || true
          git push --force-with-lease -u origin "HEAD:$BRANCH"
          # Create the label if the repo doesn't have it yet; --force is a no-op when
          # it already exists, so gh pr create never fails on a missing label.
          gh label create orbit-feedback \
            --description "Automated Orbit customer-feedback PR" \
            --color 7C3AED --force
          gh pr create \
            --title "Feedback $(date +%F)" \
            --body-file .orbit/pr-body.md \
            --label orbit-feedback
          PR_URL=$(gh pr view --json url -q .url)
          npx orbit-feedback status --from-manifest --set "In review" --pr "$PR_URL"
          npx orbit-feedback status --from-results --set Open

      - name: Release claim on failure
        if: failure() && steps.fetch.outputs.count != '0'
        run: npx orbit-feedback status --from-manifest --set Open

      - name: Upload feedback artifacts
        # The manifest, results and PR body are the only place the skip reasons are
        # readable — the claude-code-action hides its own output. .orbit/ is a hidden
        # directory, so include-hidden-files is required.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-feedback
          path: .orbit/
          include-hidden-files: true
          retention-days: 14
