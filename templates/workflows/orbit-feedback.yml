name: Orbit feedback

# Verwerkt open klantfeedback tot een PR. Draait elke werkdag om 18:00 (zomertijd
# Amsterdam; let op: de cron staat in UTC en schuift een uur met de wintertijd mee)
# en is ook handmatig te starten.
on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      project:
        description: "Project page-id (leeg = secret NOTION_PROJECT_ID)"
        required: false

concurrency:
  group: orbit-feedback
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_PROJECT_ID: ${{ github.event.inputs.project || secrets.NOTION_PROJECT_ID }}
      GH_TOKEN: ${{ secrets.ORBIT_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORBIT_GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          # Set both names: a project .npmrc may authenticate npm.pkg.github.com
          # via ${NODE_AUTH_TOKEN} (from setup-node) or via ${NPM_TOKEN}. GITHUB_TOKEN
          # only works if this repo has read access under the package's "Manage
          # Actions access"; otherwise set ORBIT_NPM_TOKEN to a PAT with read:packages.
          NODE_AUTH_TOKEN: ${{ secrets.ORBIT_NPM_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.ORBIT_NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release stale claims
        # Een gecancelde of hard-gekilde run laat punten op "In behandeling" staan;
        # de on-failure-stap vangt dat niet. Geef claims ouder dan 6 uur weer vrij,
        # zodat lekkende claims zichzelf herstellen.
        if: ${{ env.NOTION_PROJECT_ID != '' }}
        run: npx orbit-feedback status --set Open --stale 6h

      - name: Fetch open feedback
        id: fetch
        run: |
          npx orbit-feedback fetch --project "$NOTION_PROJECT_ID" --claim
          echo "count=$(jq '.items | length' .orbit/feedback.json)" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "orbit-feedback[bot]"
          git config user.email "orbit-feedback@users.noreply.github.com"
          git checkout -b "feedback/$(date +%F)"

      - name: Process feedback with Claude
        if: steps.fetch.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Zonder github_token ruilt de actie een eigen App-token in, zet die in
          # de git-config en trekt hem aan het eind van de stap weer in. De
          # push in "Open pull request" faalt dan met "Invalid username or token".
          github_token: ${{ secrets.ORBIT_GH_TOKEN || github.token }}
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(npm run *),Bash(npx *)"
          prompt: |
            Je verwerkt open Orbit-klantfeedback. Het manifest staat in
            `.orbit/feedback.json`. De branch is al aangemaakt en de punten staan
            al op "In behandeling". Doe ALLEEN het werk hieronder: NIET fetchen,
            GEEN branch maken, GEEN PR openen, GEEN Notion-status bijwerken — dat
            doet de workflow.

            Verwerk elk punt uit `.orbit/feedback.json`, in volgorde. Per punt:
            - Lokaliseer de code via `bron` (bestand:regel), dan `component`, dan
              `label`/`pagina`/`annotationId` (CSS-pad) met grep.
            - Is het een codewijziging? Voer hem uit op de juiste schaal — dat mag
              een nieuw component, een modal of meerdere bestanden zijn. Kies de
              oplossing die een ontwikkelaar ook zou kiezen, niet per se de
              kleinste. Draai typecheck/lint als die scripts bestaan en commit het
              punt precies één keer met deze vorm:

                  fix(feedback): <korte Engelse samenvatting>

                  <auteur>: "<comment>"

                  Orbit-Feedback: <notion-page-id>

            - Zit je met een aanname over aanpak, scope of plek? Maak de wijziging
              TOCH — niet overslaan — en zet je kanttekening als losse regel in de
              commit-body, in het Nederlands, zodat de reviewer het kan wegen:

                  Kanttekening: <wat je aannam en waarom>

            - Sla een punt ALLEEN over als het geen codewijziging is (compliment,
              vraag) of als je de plek echt niet kunt vinden. Noteer dat in
              `.orbit/results.json`:
              { "<id>": { "skipped": true, "reason": "<reden in het Nederlands>" } }

            Harde regels: één punt = één commit; trailer verplicht; geen
            amend/squash; raak geen ongerelateerde code aan en lever geen
            formatting-only diffs; kom niet aan package.json of lockfiles (heeft
            een punt een nieuwe dependency nodig, sla het dan over met die reden);
            code en commits Engels, klantteksten en kanttekeningen Nederlands.
            Placeholder-content mag als de klant daar zelf om vraagt. Heb je
            bestanden bewerkt, dan MOET je committen — laat nooit onverwerkte
            wijzigingen achter.

      - name: Count commits
        id: commits
        # Ook draaien als de Claude-stap faalde (bijv. max-turns): commits die
        # hij al maakte moeten alsnog een PR worden, niet met de runner sneuvelen.
        if: ${{ !cancelled() && steps.fetch.outputs.count != '0' }}
        run: |
          echo "count=$(git rev-list --count "origin/${{ github.event.repository.default_branch }}..HEAD")" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        # !cancelled(): ook na een gefaalde Claude-stap, zolang er commits zijn.
        if: ${{ !cancelled() && steps.fetch.outputs.count != '0' && steps.commits.outputs.count != '0' }}
        env:
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          BRANCH="feedback/$(date +%F)"
          # pr-body voegt zelf een "Kanttekeningen"-sectie toe uit de commit-bodies.
          npx orbit-feedback pr-body > .orbit/pr-body.md
          # --force-with-lease: een eerdere mislukte run van dezelfde dag kan de
          # bot-branch al gepusht hebben zonder PR. Fetch eerst voor een baseline,
          # zodat de lease die stale branch veilig mag overschrijven.
          git fetch origin "$BRANCH" || true
          git push -u --force-with-lease origin HEAD
          gh label create orbit-feedback \
            --description "Automated Orbit customer-feedback PR" \
            --color 7C3AED --force
          gh pr create \
            --title "Feedback $(date +%F)" \
            --body-file .orbit/pr-body.md \
            --label orbit-feedback
          PR_URL=$(gh pr view --json url -q .url)
          # Alleen echt gecommitte punten naar "In review"; de rest — overgeslagen
          # of, bij een max-turns stop, half werk zonder commit — terug naar Open,
          # zodat geen enkel punt op "In review" blijft hangen zonder wijziging.
          COMMITTED=$(git log "$BASE..HEAD" --format=%b \
            | sed -n 's/^Orbit-Feedback:[[:space:]]*//p' | sort -u)
          if [ -n "$COMMITTED" ]; then
            npx orbit-feedback status $COMMITTED --set "In review" --pr "$PR_URL"
          fi
          UNCOMMITTED=$(comm -23 \
            <(jq -r '.items[].id' .orbit/feedback.json | sort -u) \
            <(printf '%s\n' "$COMMITTED" | sort -u))
          if [ -n "$UNCOMMITTED" ]; then
            npx orbit-feedback status $UNCOMMITTED --set Open
          fi
          # Skip-redenen als antwoord terugschrijven op de overgeslagen punten.
          npx orbit-feedback status --from-results --set Open

      - name: No code changes
        # Nul commits (alles overgeslagen, of een gefaalde run zonder werk): geen
        # PR, wel alles terug naar Open met de reden uit results.json als antwoord.
        if: ${{ !cancelled() && steps.fetch.outputs.count != '0' && steps.commits.outputs.count == '0' }}
        run: |
          npx orbit-feedback status --from-manifest --set Open
          npx orbit-feedback status --from-results --set Open

      - name: Keep run output
        # feedback.json, results.json (skip-redenen) en pr-body.md zijn anders
        # niet terug te lezen: de Claude-actie verbergt zijn output.
        if: always() && steps.fetch.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-feedback-${{ github.run_id }}
          path: .orbit/
          # .orbit/ is een verborgen map; zonder dit blijft het artifact leeg.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Release claim on failure
        # Alleen als er niets gecommit is; anders zou dit de zojuist geopende PR
        # z'n punten terugzetten. Vangnet voor een cancel of een vroege fout.
        if: ${{ failure() && steps.fetch.outputs.count != '0' && steps.commits.outputs.count == '0' }}
        run: npx orbit-feedback status --from-manifest --set Open
